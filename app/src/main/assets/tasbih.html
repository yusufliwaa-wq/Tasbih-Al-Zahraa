<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سبحة إلكترونية</title>
<style>
:root{
  --bg:#f4f1e9;--card:#ffffff;--text:#1c1c1c;--muted:#7a7a7a;
  --accent:#0e7c5f;--accent2:#b08d57;--border:#e2ddd0;--shadow:rgba(0,0,0,.08);--cord:#1a1a1a;
}
:root:not([data-theme="light"]){}
:root[data-theme="dark"]{
  --bg:#101210;--card:#1b1e1c;--text:#f0ede4;--muted:#9a9a92;
  --accent:#33c99c;--accent2:#d9b06e;--border:#2c2f2c;--shadow:rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{height:100%;margin:0;}
body{
  position:relative;
  background-color:var(--bg);color:var(--text);
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);
  display:flex;flex-direction:column;min-height:100%;overflow-y:auto;overflow-x:hidden;
  transition:background .25s,color .25s;
}



#topbar{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:10px 12px;position:relative;direction:ltr;
}
.iconBtn{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  width:40px;height:40px;border-radius:50%;font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 1px 4px var(--shadow);
}
#tabs{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:14px;border:1px solid var(--border);}
.tab{
  border:none;background:transparent;color:var(--muted);padding:8px 14px;
  border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
}
.tab.active{background:var(--accent);color:#fff;}
#leftControls{display:flex;flex-direction:column;gap:6px;align-items:center;}
#rightControls{display:flex;gap:8px;}
#menuBtn{
  position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0));left:14px;z-index:15;
}
#appMenu{
  position:fixed;bottom:calc(60px + env(safe-area-inset-bottom,0));left:14px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;box-shadow:0 4px 14px var(--shadow);overflow:hidden;z-index:20;
}
#appMenu button{
  display:block;width:160px;padding:12px 14px;background:none;border:none;color:var(--text);
  font-size:14px;text-align:right;cursor:pointer;
}
#appMenu button:hover{background:var(--bg);}
#bgLayer{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-repeat:no-repeat;background-size:cover;background-position:center;
}
#settingsModalOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;
  z-index:65;padding:18px;
}
#settingsModalOverlay.hidden{display:none !important;}
#settingsBox{
  background:var(--card);border-radius:16px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;
  padding:22px 20px;position:relative;box-shadow:0 10px 30px var(--shadow);
}
#settingsCloseX{
  position:absolute;top:10px;right:10px;background:none;border:none;font-size:20px;
  color:var(--muted);cursor:pointer;
}
#settingsTitleMain{font-size:18px;color:var(--accent2);text-align:center;margin:0 0 18px;}
.settingsSection{margin-bottom:18px;}
.settingsLabel{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600;}
.settingsRow{display:flex;gap:8px;flex-wrap:wrap;}
.settingsChoice{
  flex:1;min-width:80px;background:var(--bg);color:var(--text);border:2px solid var(--border);
  border-radius:10px;padding:10px 8px;font-size:13.5px;cursor:pointer;font-weight:600;
}
.settingsChoice.selected{border-color:var(--accent);background:var(--accent);color:#fff;}
.settingsGreenBtn{
  flex:1;background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:11px 10px;font-size:14px;font-weight:700;cursor:pointer;
}
.settingsRedBtn{
  flex:1;background:#c0392b;color:#fff;border:none;border-radius:10px;
  padding:11px 10px;font-size:14px;font-weight:700;cursor:pointer;
}
.settingsBottomRow{display:flex;gap:10px;margin-top:6px;}
#langMenu{
  position:absolute;top:56px;right:12px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;box-shadow:0 4px 14px var(--shadow);overflow:hidden;z-index:20;
}
#langMenu button{
  display:block;width:140px;padding:10px 14px;background:none;border:none;color:var(--text);
  font-size:14px;text-align:right;cursor:pointer;
}
#langMenu button:hover{background:var(--bg);}
.hidden{display:none !important;}
.panel{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:11px;padding:10px 20px;
}
.panelTitle{font-size:22px;font-weight:700;color:var(--accent2);margin:0;}
.phraseTitle{font-size:26px;font-weight:700;min-height:34px;}
.counterBox{
  width:min(30vw,120px);height:min(30vw,120px);border-radius:50%;
  background:var(--card);border:3px solid var(--accent);color:var(--text);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:800;box-shadow:0 4px 14px var(--shadow);
  cursor:pointer;user-select:none;
}
.targetLabel{color:var(--muted);font-size:15px;}
.tasbihBtn{
  width:min(52vw,190px);height:min(52vw,190px);border-radius:50%;background:var(--accent);border:none;
  font-size:70px;color:#fff;box-shadow:0 8px 22px var(--shadow);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.tasbihBtn:active{transform:scale(.92);}

#customCountRow{display:flex;gap:8px;}
#customCountRow button{
  background:var(--card);color:var(--accent);border:1px solid var(--accent);
  padding:8px 16px;border-radius:10px;font-size:14px;cursor:pointer;font-weight:600;
}
#dhikrModalOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:55;padding:20px;
}
#dhikrModalOverlay.hidden{display:none !important;}
#dhikrInput{
  width:240px;text-align:center;font-size:16px;padding:10px;border-radius:10px;
  border:1px solid var(--border);background:var(--bg);color:var(--text);margin-bottom:14px;
}
#dhikrInput::placeholder{color:var(--muted);opacity:.6;}
#modalOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;
}
#modalBox{
  background:var(--card);padding:28px 24px;border-radius:16px;max-width:80vw;text-align:center;
  box-shadow:0 10px 30px var(--shadow);
}
#modalBox p{font-size:18px;font-weight:600;margin:0 0 18px;}
#modalOk{
  background:var(--accent);color:#fff;border:none;padding:10px 30px;border-radius:10px;
  font-size:15px;cursor:pointer;font-weight:700;
}
#customModalOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:55;padding:20px;
}
#customModalOverlay.hidden{display:none !important;}
#customInput{
  width:140px;text-align:center;font-size:22px;padding:8px;border-radius:10px;
  border:1px solid var(--border);background:var(--bg);color:var(--text);margin-bottom:14px;
}
.modalRow{display:flex;gap:10px;justify-content:center;}
.modalRow button{
  border:none;border-radius:10px;padding:10px 22px;font-size:15px;font-weight:700;cursor:pointer;
}
#customCancel{background:var(--bg);color:var(--text);border:1px solid var(--border) !important;}
#customConfirm{background:var(--accent);color:#fff;}
#dhikrCancel{background:var(--bg);color:var(--text);border:1px solid var(--border) !important;}
#dhikrConfirm{background:var(--accent);color:#fff;}
#privacyBtn{
  position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0));right:14px;z-index:15;
  background:var(--card);color:var(--muted);border:1px solid var(--border);
  padding:7px 14px;border-radius:20px;font-size:12px;cursor:pointer;
  box-shadow:0 2px 8px var(--shadow);
  display:flex;align-items:center;gap:6px;direction:ltr;
}
#privacyBtn .verTag{color:var(--accent2);font-weight:700;font-size:11px;}
#privacyModalOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;
}
#privacyModalOverlay.hidden{display:none !important;}
#privacyBox{
  background:var(--card);padding:22px 20px;border-radius:16px;max-width:92vw;width:420px;
  max-height:80vh;overflow-y:auto;box-shadow:0 10px 30px var(--shadow);text-align:right;
}
#privacyBox h2{font-size:19px;color:var(--accent2);margin:0 0 14px;text-align:center;}
#privacyBox h4{font-size:15px;color:var(--accent);margin:14px 0 6px;}
#privacyBox p,#privacyBox li{font-size:13.5px;line-height:1.7;margin:0 0 6px;color:var(--text);}
#privacyBox ul{margin:0 0 6px;padding-inline-start:18px;}
#privacyCredit{margin-top:18px;text-align:center;font-size:11px;color:var(--muted);}
#privacyClose{
  display:block;margin:16px auto 0;background:var(--accent);color:#fff;border:none;
  padding:9px 26px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;
}

</style>
</head>

<div id="topbar">
  <div id="leftControls">

    <button id="minusBtn" class="iconBtn hidden" title="minus">−</button>
  </div>
  <div id="tabs">
    <button class="tab active" data-tab="zahra"></button>
    <button class="tab" data-tab="open"></button>
  </div>
  <div id="rightControls">
    <button id="themeBtn" class="iconBtn">🌙</button>
    <button id="langBtn" class="iconBtn">🌐</button>
  </div>
</div>

<div id="langMenu" class="hidden">
  <button data-lang="ar">العربية</button>
  <button data-lang="fa">فارسی</button>
  <button data-lang="en">English</button>
</div>

<div id="appMenu" class="hidden">
  <button id="openSettingsBtn"></button>
</div>

<div id="zahraPanel" class="panel">

  <div class="phraseTitle" id="zahraPhrase"></div>

  <div class="targetLabel" id="zahraTarget"></div>

</div>

<div id="openPanel" class="panel hidden">
  <h1 class="panelTitle" id="openTitle"></h1>
  <div class="phraseTitle hidden" id="openPhraseDisplay"></div>
  <button id="openCounterBox" class="counterBox"><span id="openCount">0</span></button>
  <div id="customCountRow"><button id="customCountBtn"></button><button id="dhikrBtn"></button></div>
  
  <button id="openTapBtn" class="tasbihBtn">📿</button>
</div>

<div id="modalOverlay" class="hidden">
  <div id="modalBox">
    <p id="modalText"></p>
    <button id="modalOk"></button>
  </div>
</div>

<div id="customModalOverlay" class="hidden">

    <p id="customModalTitle"></p>
    <input type="number" id="customInput" inputmode="numeric" min="1" placeholder="70">
    <div class="modalRow">
      <button id="customCancel"></button>
      <button id="customConfirm"></button>
    </div>
  </div>
</div>


<div id="dhikrModalOverlay" class="hidden">
  <div id="modalBox">
    <p id="dhikrModalTitle"></p>
    <input type="text" id="dhikrInput" placeholder="">
    <div class="modalRow">
      <button id="dhikrClearBtn" class="iconBtn" title="clear">⟲</button>
      <button id="dhikrCancel"></button>
      <button id="dhikrConfirm"></button>
    </div>
  </div>
</div>

<button id="menuBtn" class="iconBtn" title="menu">☰</button>

<button id="privacyBtn"><span id="privacyBtnLabel"></span><span class="verTag">V 1.0</span></button>
<div id="privacyModalOverlay" class="hidden">
  <div id="privacyBox">
    <h2 id="privacyModalTitle"></h2>
    <div id="privacyModalBody"></div>
    <div id="privacyCredit"></div>
    <button id="privacyClose"></button>
  </div>
</div>

<div id="bgLayer"></div>

<div id="settingsModalOverlay" class="hidden">
  <div id="settingsBox">
    <button id="settingsCloseX">✕</button>
    <h2 id="settingsTitleMain"></h2>

    <div class="settingsSection">
      <div class="settingsLabel" id="settingsLangLabel"></div>
      <div class="settingsRow" id="settingsLangRow">
        <button class="settingsChoice" data-lang="ar">العربية</button>
        <button class="settingsChoice" data-lang="fa">فارسی</button>
        <button class="settingsChoice" data-lang="en">English</button>
      </div>
    </div>

    <div class="settingsSection">
      <div class="settingsLabel" id="settingsThemeLabel"></div>
      <div class="settingsRow" id="settingsThemeRow">
        <button class="settingsChoice" data-theme-choice="light" id="settingsThemeLight"></button>
        <button class="settingsChoice" data-theme-choice="dark" id="settingsThemeDark"></button>
      </div>
    </div>

    <div class="settingsSection">
      <div class="settingsLabel" id="settingsBgLabel"></div>
      <input type="file" id="bgFileInput" accept="image/*" class="hidden">
      <div class="settingsRow">
        <button id="changeBgBtn" class="settingsGreenBtn"></button>
        <button id="resetBgBtn" class="settingsRedBtn"></button>
      </div>
    </div>

    <div class="settingsBottomRow">
      <button id="settingsResetAllBtn" class="settingsRedBtn"></button>
      <button id="settingsOkBtn" class="settingsGreenBtn"></button>
    </div>
  </div>
</div>

     cancel:'إلغاء',confirm:'تأكيد',privacyBtn:'سياسة الخصوصية',privacyTitle:'سياسة الخصوصية',privacyBody:"<h4>الغرض من البرنامج</h4>\n<p>هذا التطبيق سبحة إلكترونية (تسبيح الزهراء + تسبيح مفتوح) يشتغل بالكامل داخل متصفحك/جهازك، بدون سيرفر أو قاعدة بيانات خارجية.</p>\n<h4>المعلومات اللي نجمعها</h4>\n<p><b>لا نجمع أي معلومة شخصية إطلاقاً.</b> التطبيق:</p>\n<ul>\n<li>ما يطلب اسمك، إيميلك، رقمك، أو أي بيانات تعريف</li>\n<li>ما يحتاج حساب أو تسجيل دخول</li>\n<li>ما يستخدم أي أدوات تتبع أو تحليلات (Analytics) أو إعلانات</li>\n</ul>\n<h4>التخزين المحلي (Local Storage)</h4>\n<p>التطبيق يحفظ الإعدادات التالية <b>على جهازك أنت فقط</b>، وما ترسل لأي مكان: اللغة المختارة، الوضع (داكن/فاتح)، وحالة العداد الحالية. هذي البيانات تنمسح تلقائياً لو مسحت بيانات المتصفح.</p>\n<h4>الاهتزاز (Vibration)</h4>\n<p>التطبيق يستخدم ميزة الاهتزاز المدمجة بجهازك للتنبيه فقط، وما يجمع أو يخزن أي بيانات من هذي الميزة.</p>\n<h4>الأطراف الثالثة</h4>\n<p>لا توجد.</p>\n<h4>التواصل</h4>\n<p>لأي استفسار: yusufliwaa@protonmail.com</p>",privacyClose:'إغلاق',dhikrBtn:'تحديد ذكر',dhikrTitle:'اكتب الذكر اللي تريد تسبّحه (اختياري)',dhikrPlaceholder:'اللهم صل على محمد وآل محمد',flag:'🇮🇶',

     cancel:'لغو',confirm:'تأیید',privacyBtn:'حریم خصوصی',privacyTitle:'سیاست حریم خصوصی',privacyBody:"<h4>هدف برنامه</h4>\n<p>این برنامه یک تسبیح الکترونیکی (تسبیح زهرا + تسبیح آزاد) است که کاملاً داخل مرورگر/دستگاه شما اجرا می‌شود، بدون سرور یا پایگاه داده خارجی.</p>\n<h4>اطلاعاتی که جمع‌آوری می‌کنیم</h4>\n<p><b>هیچ اطلاعات شخصی جمع‌آوری نمی‌شود.</b> این برنامه:</p>\n<ul>\n<li>نام، ایمیل، شماره یا هیچ اطلاعات شناسایی درخواست نمی‌کند</li>\n<li>نیازی به حساب کاربری یا ورود ندارد</li>\n<li>از هیچ ابزار ردیابی، آنالیتیکس یا تبلیغات استفاده نمی‌کند</li>\n</ul>\n<h4>ذخیره‌سازی محلی (Local Storage)</h4>\n<p>برنامه تنظیمات زیر را <b>فقط روی دستگاه شما</b> ذخیره می‌کند و به هیچ‌جا ارسال نمی‌شود: زبان انتخابی، حالت (تیره/روشن)، و وضعیت فعلی شمارنده. این داده‌ها با پاک کردن اطلاعات مرورگر به‌طور خودکار حذف می‌شوند.</p>\n<h4>لرزش (Vibration)</h4>\n<p>برنامه فقط برای اعلان از قابلیت لرزش دستگاه شما استفاده می‌کند و هیچ داده‌ای از این طریق جمع‌آوری یا ذخیره نمی‌شود.</p>\n<h4>اشخاص ثالث</h4>\n<p>وجود ندارد.</p>\n<h4>ارتباط</h4>\n<p>برای هرگونه سؤال: yusufliwaa@protonmail.com</p>",privacyClose:'بستن',dhikrBtn:'تعیین ذکر',dhikrTitle:'ذکری که می‌خواهید بگویید بنویسید (اختیاری)',dhikrPlaceholder:'مثلاً: سبحان‌الله',flag:'🇮🇷',

function toDigits(n){
  n=String(n);
  if(TXT[lang].digits==='ar')return n.replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
  if(TXT[lang].digits==='fa')return n.replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  return n;
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme',theme);
  document.getElementById('themeBtn').textContent=theme==='dark'?'☀️':'🌙';
  const lb=document.getElementById('settingsThemeLight'),db=document.getElementById('settingsThemeDark');
  if(lb&&db){lb.classList.toggle('selected',theme==='light');db.classList.toggle('selected',theme==='dark');}
}
function applyLang(){
  const t=TXT[lang];
  document.documentElement.lang=lang;
  document.getElementById('zahraTitle').textContent=t.phrases? zLabel():'';
  document.getElementById('openTitle').textContent=t.tab2;
  document.querySelector('.tab[data-tab="zahra"]').textContent=t.tab1;
  document.querySelector('.tab[data-tab="open"]').textContent=t.tab2;
  document.getElementById('customCountBtn').textContent=t.customBtn;
  document.getElementById('dhikrBtn').textContent=t.dhikrBtn;
  document.getElementById('dhikrModalTitle').textContent=t.dhikrTitle;
  document.getElementById('dhikrInput').placeholder=t.dhikrPlaceholder;
  document.getElementById('langBtn').textContent='🌐';
  document.getElementById('dhikrCancel').textContent=t.cancel;
  document.getElementById('dhikrConfirm').textContent=t.confirm;
  document.getElementById('modalOk').textContent=t.ok;
  document.getElementById('customModalTitle').textContent=t.promptTitle;
  document.getElementById('customCancel').textContent=t.cancel;
  document.getElementById('customConfirm').textContent=t.confirm;
  document.getElementById('privacyBtnLabel').textContent=t.privacyBtn;
  document.getElementById('privacyModalTitle').textContent=t.privacyTitle;
  document.getElementById('privacyModalBody').innerHTML=t.privacyBody;
  document.getElementById('privacyClose').textContent=t.privacyClose;
  document.getElementById('privacyCredit').innerHTML='تم إنشاء البرنامج باستخدام Claude<br>بواسطة يوسف لواء أبو طبيخ';
  document.getElementById('openSettingsBtn').textContent=t.menuSettings;
  document.getElementById('settingsTitleMain').textContent=t.settingsTitle;
  document.getElementById('settingsLangLabel').textContent=t.settingsLang;
  document.getElementById('settingsThemeLabel').textContent=t.settingsTheme;
  document.getElementById('settingsThemeLight').textContent=t.themeLight;
  document.getElementById('settingsThemeDark').textContent=t.themeDark;
  document.getElementById('settingsBgLabel').textContent=t.settingsBg;
  document.getElementById('changeBgBtn').textContent=t.changeBg;
  document.getElementById('resetBgBtn').textContent=t.resetBg;
  document.getElementById('settingsOkBtn').textContent=t.settingsOk;
  document.getElementById('settingsResetAllBtn').textContent=t.resetAll;
  document.querySelectorAll('.settingsChoice[data-lang]').forEach(b=>{
    b.classList.toggle('selected',b.dataset.lang===lang);
  });
  renderZahra();renderOpen();
}
function zLabel(){return lang==='ar'?'تسبيحة الزهراء':(lang==='fa'?'تسبیح زهرا':"Zahra's Tasbih");}
function renderZahra(){
  const t=TXT[lang];
  document.getElementById('zahraTitle').textContent=zLabel();
  document.getElementById('zahraPhrase').textContent=t.phrases[zPhase];
  document.getElementById('zahraCount').textContent=toDigits(zCount);
  document.getElementById('zahraTarget').textContent=t.fromWord+' '+toDigits(LABELS[zPhase]);
}
function renderOpen(){
  const val=customTarget!==null?customTarget:oCount;
  document.getElementById('openCount').textContent=toDigits(val);
  const disp=document.getElementById('openPhraseDisplay');
  if(openPhrase){disp.textContent=openPhrase;disp.classList.remove('hidden');}
  else{disp.classList.add('hidden');}
}
function vibrate(pattern){try{if(navigator.vibrate)navigator.vibrate(pattern);}catch(e){}}
function showModal(msg){
  document.getElementById('modalText').textContent=msg;
  document.getElementById('modalOverlay').classList.remove('hidden');
}
document.getElementById('modalOk').onclick=()=>document.getElementById('modalOverlay').classList.add('hidden');
document.getElementById('modalOverlay').addEventListener('click',(e)=>{
  if(e.target.id==='modalOverlay')document.getElementById('modalOverlay').classList.add('hidden');
});


document.getElementById('zahraTapBtn').onclick=()=>{
  if(zCount<TARGETS[zPhase]){
    zCount++;
    vibrate(35);
  } else {
    zPhase++;
    if(zPhase>2){
      zPhase=0; zCount=0;
      vibrate([300,120,300,120,300]);
      showModal(TXT[lang].done);
    } else {
      zCount=0;
      vibrate([80,50,80]);
    }
  }
  renderZahra();
};
document.getElementById('openTapBtn').onclick=()=>{
  vibrate(35);
  if(customTarget!==null){
    customTarget--;
    if(customTarget<=0){
      vibrate([300,120,300,120,300]);
      showModal(TXT[lang].doneCustom);
      customTarget=null; customTargetMax=null; oCount=0;
    }
  } else {
    oCount++;
  }
  renderOpen();
};
document.getElementById('customCountBtn').onclick=()=>{
  vibrate(45);
  document.getElementById('customInput').value='';
  document.getElementById('customModalOverlay').classList.remove('hidden');
  document.getElementById('customInput').focus();
};
document.getElementById('customCancel').onclick=()=>{
  vibrate(45);
  document.getElementById('customModalOverlay').classList.add('hidden');
};
document.getElementById('customConfirm').onclick=()=>{
  vibrate(45);
  const n=parseInt(document.getElementById('customInput').value,10);
  if(!isNaN(n)&&n>0){customTarget=n;customTargetMax=n;oCount=0;renderOpen();}
  document.getElementById('customModalOverlay').classList.add('hidden');
};
document.getElementById('dhikrBtn').onclick=()=>{
  vibrate(45);
  document.getElementById('dhikrInput').value=openPhrase;
  document.getElementById('dhikrModalOverlay').classList.remove('hidden');
  document.getElementById('dhikrInput').focus();
};
document.getElementById('dhikrClearBtn').onclick=()=>{
  vibrate(45);
  document.getElementById('dhikrInput').value='';
  document.getElementById('dhikrInput').focus();
};
document.getElementById('dhikrCancel').onclick=()=>{
  vibrate(45);
  document.getElementById('dhikrModalOverlay').classList.add('hidden');
};
document.getElementById('dhikrConfirm').onclick=()=>{
  vibrate(45);
  openPhrase=document.getElementById('dhikrInput').value.trim();
  renderOpen();
  document.getElementById('dhikrModalOverlay').classList.add('hidden');
};
document.getElementById('resetBtn').onclick=()=>{
  vibrate(45);
  if(activeTab==='zahra'){zPhase=0;zCount=0;renderZahra();}
  else{oCount=0;customTarget=null;customTargetMax=null;renderOpen();}
};
document.getElementById('minusBtn').onclick=()=>{
  vibrate(45);
  if(customTarget!==null){customTarget=Math.min(customTargetMax,customTarget+1);}
  else{oCount=Math.max(0,oCount-1);}
  renderOpen();
};
document.getElementById('privacyBtn').onclick=()=>{
  vibrate(45);
  document.getElementById('privacyModalOverlay').classList.remove('hidden');
};
document.getElementById('privacyClose').onclick=()=>{
  vibrate(45);
  document.getElementById('privacyModalOverlay').classList.add('hidden');
};
document.querySelectorAll('.tab').forEach(btn=>{
  btn.onclick=()=>{
    vibrate(45);
    activeTab=btn.dataset.tab;
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('zahraPanel').classList.toggle('hidden',activeTab!=='zahra');
    document.getElementById('openPanel').classList.toggle('hidden',activeTab!=='open');
    document.getElementById('minusBtn').classList.toggle('hidden',activeTab!=='open');
  };
});
document.getElementById('themeBtn').onclick=()=>{
  vibrate(45);
  theme=theme==='dark'?'light':'dark';
  localStorage.setItem('tasbih_theme',theme);
  applyTheme();
};
document.getElementById('langBtn').onclick=()=>{
  vibrate(45);
  document.getElementById('langMenu').classList.toggle('hidden');
};
document.querySelectorAll('#langMenu button').forEach(b=>{
  b.onclick=()=>{
    vibrate(45);
    lang=b.dataset.lang;
    localStorage.setItem('tasbih_lang',lang);
    document.getElementById('langMenu').classList.add('hidden');
    applyLang();
  };
});

document.getElementById('menuBtn').onclick=()=>{
  vibrate(45);
  document.getElementById('appMenu').classList.toggle('hidden');
};
document.getElementById('openSettingsBtn').onclick=()=>{
  vibrate(45);
  document.getElementById('appMenu').classList.add('hidden');
  document.getElementById('settingsModalOverlay').classList.remove('hidden');
};
function closeSettings(){
  document.getElementById('settingsModalOverlay').classList.add('hidden');
}
document.getElementById('settingsCloseX').onclick=()=>{vibrate(45);closeSettings();};
document.getElementById('settingsOkBtn').onclick=()=>{vibrate(45);closeSettings();};

document.querySelectorAll('.settingsChoice[data-lang]').forEach(b=>{
  b.onclick=()=>{
    vibrate(45);
    lang=b.dataset.lang;
    localStorage.setItem('tasbih_lang',lang);
    applyLang();
  };
});
document.getElementById('settingsThemeLight').onclick=()=>{
  vibrate(45);
  theme='light';
  localStorage.setItem('tasbih_theme',theme);
  applyTheme();
};
document.getElementById('settingsThemeDark').onclick=()=>{
  vibrate(45);
  theme='dark';
  localStorage.setItem('tasbih_theme',theme);
  applyTheme();
};

function setBgImage(dataUrl){
  document.getElementById('bgLayer').style.backgroundImage="url('"+dataUrl+"')";
  try{localStorage.setItem('tasbih_bg',dataUrl);}catch(e){}
}
function clearBgImage(){
  document.getElementById('bgLayer').style.backgroundImage='';
  localStorage.removeItem('tasbih_bg');
}
document.getElementById('changeBgBtn').onclick=()=>{
  vibrate(45);
  document.getElementById('bgFileInput').click();
};
document.getElementById('bgFileInput').onchange=(e)=>{
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{setBgImage(reader.result);};
  reader.readAsDataURL(file);
};
document.getElementById('resetBgBtn').onclick=()=>{
  vibrate(45);
  clearBgImage();
};
document.getElementById('settingsResetAllBtn').onclick=()=>{
  vibrate(45);
  lang='ar';theme='light';
  localStorage.setItem('tasbih_lang',lang);
  localStorage.setItem('tasbih_theme',theme);
  clearBgImage();
  applyLang();applyTheme();
  closeSettings();
};
try{
  const savedBg=localStorage.getItem('tasbih_bg');
  if(savedBg)document.getElementById('bgLayer').style.backgroundImage="url('"+savedBg+"')";
}catch(e){}

try{ if(localStorage.getItem('tasbih_state')){
  const s=JSON.parse(localStorage.getItem('tasbih_state'));
  zPhase=s.zPhase||0; zCount=s.zCount||0; oCount=s.oCount||0;
}}catch(e){}
applyTheme();applyLang();
</script>
</body>
</html>
